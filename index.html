<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#e9f1e9;--muted:#82939a;--line:#263840;--panel:#14232b;--deep:#0d171e;--mint:#bce8cf;--amber:#efb873;--coral:#e98c78;--mono:'DM Mono',monospace;--sans:Manrope,'Microsoft YaHei',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d171e;color:var(--ink);font-family:var(--sans);min-height:100vh;background-image:radial-gradient(ellipse at 47% 36%,#1c3036 0,transparent 56%),linear-gradient(120deg,#101b23,#0c151c 65%)}button{font:inherit;color:inherit} .shell{max-width:1320px;margin:auto;padding:26px 38px 38px}.topbar{height:45px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}.brand-mark{width:26px;height:26px;color:var(--mint)}.top-right{display:flex;align-items:center;gap:20px;color:var(--muted);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.live-dot{width:7px;height:7px;background:var(--mint);border-radius:50%;box-shadow:0 0 12px #9be6bf;display:inline-block;margin-right:8px}.toplink{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;letter-spacing:inherit}.toplink:hover{color:var(--ink)}.intro{display:flex;justify-content:space-between;align-items:end;padding:34px 0 24px}.intro h1{font-size:clamp(27px,4vw,43px);letter-spacing:-.055em;line-height:1.05;margin:0 0 9px;font-weight:600}.intro p{color:#9cafb2;margin:0;font-size:13px}.mission{font:11px var(--mono);color:var(--amber);letter-spacing:.12em}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(310px,.75fr);gap:16px;align-items:stretch}.panel{background:linear-gradient(145deg,rgba(24,42,50,.94),rgba(17,31,39,.95));border:1px solid #2a3d44;border-radius:12px;overflow:hidden}.map-panel{min-height:435px;position:relative;display:flex;flex-direction:column}.panel-head{height:54px;border-bottom:1px solid var(--line);padding:0 19px;display:flex;align-items:center;justify-content:space-between;font:10px var(--mono);color:#9db1b4;letter-spacing:.12em;text-transform:uppercase}.weather{display:flex;align-items:center;gap:8px;color:var(--mint)}.map{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#203b42 0%,#19343b 45%,#152d34 100%)}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#9ec7bb0b 1px,transparent 1px),linear-gradient(90deg,#9ec7bb0b 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 88%,transparent)}.map::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 6%,#101c243d 78%)}.coast{position:absolute;inset:0;width:100%;height:100%;z-index:1}.waterline{fill:none;stroke:#84bcb0;stroke-opacity:.32;stroke-width:1.2;stroke-dasharray:3 7}.route{fill:none;stroke:#e4b982;stroke-width:1.5;stroke-dasharray:5 5;opacity:.82}.island{fill:#273f3e;stroke:#7f9f8a;stroke-opacity:.5;stroke-width:1}.place{position:absolute;z-index:2;display:flex;align-items:center;gap:8px;font:9px var(--mono);letter-spacing:.08em;color:#afc5be;text-shadow:0 1px 5px #0d171e}.pin{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px #9de8c4}.place.lighthouse{left:15%;top:40%;color:var(--mint)}.place.bay{right:19%;top:24%}.place.cove{right:15%;bottom:25%}.place.cliff{left:40%;bottom:15%}.place.bay .pin{background:var(--amber);box-shadow:0 0 12px #efb873}.place.cove .pin{background:var(--coral);box-shadow:0 0 12px #e98c78}.boat{position:absolute;left:56%;top:51%;z-index:3;transition:left .7s ease,top .7s ease;font-size:23px;filter:drop-shadow(0 0 10px #b6e6d9)}.compass{position:absolute;right:20px;bottom:16px;z-index:2;color:#8da9a5;font:10px var(--mono);line-height:1.5;text-align:center}.map-caption{height:42px;background:#13232a;padding:13px 18px;color:#8fa2a6;font:10px var(--mono);letter-spacing:.06em}.side{display:flex;flex-direction:column;gap:16px}.status{padding:19px 20px}.section-title{font:10px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:#95a9ac;margin:0 0 17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat label{display:block;color:#809397;font:9px var(--mono);letter-spacing:.1em;margin-bottom:8px}.stat strong{font-size:23px;font-weight:500;letter-spacing:-.04em}.stat span{font:10px var(--mono);color:#a6bab4}.meter{height:3px;background:#31454a;margin-top:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--mint);transition:width .35s}.stat:nth-child(2) .meter i{background:var(--amber)}.stat:nth-child(3) .meter i{background:#df9b83}.objective{margin-top:18px;padding:12px 14px;border:1px solid #31454a;background:#122129;border-radius:7px;display:flex;align-items:center;justify-content:space-between}.objective span:first-child{font:9px var(--mono);letter-spacing:.09em;color:#8ca3a5}.objective strong{font-size:12px;font-weight:600;color:var(--mint)}.log{flex:1;min-height:0;padding:18px 20px;display:flex;flex-direction:column}.log-head{display:flex;justify-content:space-between;align-items:center}.log-head .section-title{margin:0}.log-scroll{margin-top:14px;border-top:1px solid var(--line);padding-top:5px;overflow:auto;max-height:190px}.log-line{display:grid;grid-template-columns:43px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #25373d;font-size:11px;line-height:1.55;color:#a9b9b6}.log-line time{font:9px var(--mono);color:#71878b;padding-top:2px}.log-line b{color:#dbe9df;font-weight:600}.log-line.event b{color:var(--amber)}.actions{margin-top:16px}.actions-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 10px}.actions-head .section-title{margin:0}.hint{font:9px var(--mono);color:#73878d;letter-spacing:.08em}.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{background:#172a31;border:1px solid #344a50;padding:14px 15px 13px;border-radius:8px;cursor:pointer;text-align:left;transition:background .2s,border .2s,transform .2s}.action:hover:not(:disabled){background:#203a3e;border-color:#86b49d;transform:translateY(-2px)}.action:disabled{opacity:.38;cursor:not-allowed}.action .icon{display:block;color:var(--mint);font-size:15px;margin-bottom:9px}.action:nth-child(2) .icon{color:var(--amber)}.action:nth-child(3) .icon{color:#e7a28c}.action strong{display:block;font-size:12px;font-weight:600;margin-bottom:4px}.action small{font-size:10px;color:#8ca0a3;line-height:1.5}.action .cost{display:block;color:#6f868b;font:9px var(--mono);margin-top:9px;letter-spacing:.03em}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:19px;padding-top:14px;color:#647a80;font:9px var(--mono);letter-spacing:.07em}.footer strong{color:#93ada7;font-weight:400}.overlay{position:fixed;inset:0;z-index:10;background:#091116bd;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}.modal{width:min(460px,100%);padding:30px;border:1px solid #47605d;border-radius:12px;background:linear-gradient(145deg,#1c3439,#122129);box-shadow:0 25px 90px #0008}.modal .kicker{font:10px var(--mono);color:var(--amber);letter-spacing:.17em;margin-bottom:13px}.modal h2{font-size:27px;letter-spacing:-.04em;margin:0 0 12px}.modal p{font-size:13px;line-height:1.8;color:#afc0bb;margin:0}.choices{display:grid;gap:8px;margin-top:23px}.choice,.primary{border:1px solid #47605d;border-radius:7px;padding:12px 14px;background:#213a3e;text-align:left;cursor:pointer;font-size:12px;transition:.18s}.choice:hover,.primary:hover{background:#2b4946;border-color:#8fc8a8}.primary{background:var(--mint);border-color:var(--mint);color:#14251f;text-align:center;font-weight:700}.primary:hover{background:#d6f2df}.hidden{display:none!important}.round-end{position:absolute;inset:0;background:#0b161dd9;z-index:4;display:grid;place-items:center;text-align:center}.round-end h2{font-size:26px;margin:0 0 8px}.round-end p{color:#a5b8b2;font-size:12px;line-height:1.7;max-width:330px;margin:0 auto 20px}.round-end .primary{min-width:145px;text-align:center}.reduce *{transition:none!important}
@media(max-width:850px){.shell{padding:20px 20px 28px}.grid{grid-template-columns:1fr}.map-panel{min-height:350px}.side{display:grid;grid-template-columns:1fr 1fr}.status,.log{min-height:215px}.log-scroll{max-height:130px}}
@media(max-width:600px){.shell{padding:16px 14px 22px}.top-right{gap:9px;font-size:9px}.toplink{font-size:9px}.intro{padding:28px 0 19px}.intro h1{font-size:31px}.intro p{font-size:11px}.mission{font-size:9px}.grid{gap:11px}.map-panel{min-height:300px}.panel-head{height:45px;padding:0 13px}.place{font-size:8px}.side{display:flex;gap:11px}.status{padding:16px}.log{min-height:185px;padding:16px}.stats{gap:7px}.stat strong{font-size:20px}.action-grid{gap:7px}.action{padding:11px 10px}.action strong{font-size:11px}.action small{font-size:9px}.action .cost{font-size:8px}.hint{font-size:8px}.footer{font-size:8px}.footer span:last-child{max-width:150px;text-align:right}}
</style>
</head>
<body><main class="shell">
<header class="topbar"><div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3v26M4 16h24M7.5 7.5l17 17m0-17-17 17" stroke="currentColor" stroke-width="1.2"/><circle cx="16" cy="16" r="5.5" stroke="currentColor" stroke-width="1.2"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/></svg>雾港电台</div><div class="top-right"><span><i class="live-dot"></i>信号在线</span><span id="clock">23:40</span><button class="toplink" id="help">玩法说明</button></div></header>
<section class="intro"><div><h1>最后一班夜航</h1><p>浓雾封锁了海湾。让每一束灯光都去对的地方。</p></div><div class="mission" id="round">第 01 / 10 夜</div></section>
<section class="grid"><div class="panel map-panel"><div class="panel-head"><span>雾港 · 海图 04</span><span class="weather">◌ &nbsp;能见度 低</span></div><div class="map"><svg class="coast" viewBox="0 0 800 420" preserveAspectRatio="none" aria-hidden="true"><path class="waterline" d="M-20 310 Q90 270 180 330 T360 305 T560 338 T820 285M-10 85 Q115 125 200 83 T395 106 T610 72 T830 115M60 0 Q40 90 90 165 T80 420M720 0 Q680 80 740 155 T710 420"/><path class="island" d="M270 114q34-20 76-8l25 26-10 41-38 19-35-18-24-31zM459 260l35-23 51 8 14 34-24 27-49-4-30-17zM125 244l28-15 28 20-8 33-31 5-22-18z"/><path class="route" id="route" d="M143 177 Q330 122 461 204 T620 300"/></svg><div class="place lighthouse"><i class="pin"></i>雾港灯塔</div><div class="place bay"><i class="pin"></i>北湾 · 3 人</div><div class="place cove"><i class="pin"></i>红礁 · 2 人</div><div class="place cliff"><i class="pin"></i>旧信号台</div><div class="boat" id="boat" aria-label="救援船">⌁</div><div class="compass">N<br>↑</div></div><div class="map-caption" id="mapcaption">灯塔微光穿过浓雾。海面上有两处求救信号。</div><div class="round-end hidden" id="end"></div></div>
<aside class="side"><div class="panel status"><h2 class="section-title">救援状态 · 船上资源</h2><div class="stats"><div class="stat"><label>燃料</label><strong id="fuel">7</strong><span> / 10</span><div class="meter"><i id="fuelbar" style="width:70%"></i></div></div><div class="stat"><label>信号</label><strong id="signal">3</strong><span> / 10</span><div class="meter"><i id="signalbar" style="width:30%"></i></div></div><div class="stat"><label>船员</label><strong id="crew">4</strong><span> / 6</span><div class="meter"><i id="crewbar" style="width:67%"></i></div></div></div><div class="objective"><span>已接回遇险者</span><strong id="rescued">0 / 7</strong></div></div>
<div class="panel log"><div class="log-head"><h2 class="section-title">无线电日志</h2><span class="hint">最近优先</span></div><div class="log-scroll" id="log"></div></div></aside></section>
<section class="actions"><div class="actions-head"><h2 class="section-title">选择本夜行动</h2><span class="hint">每夜行动一次 · 资源有限</span></div><div class="action-grid"><button class="action" data-act="signal"><span class="icon">⌁</span><strong>校准信号</strong><small>提升灯塔功率，扩大搜索范围</small><span class="cost">消耗 1 燃料</span></button><button class="action" data-act="search"><span class="icon">⌖</span><strong>驶入雾区</strong><small>前往已发现的求救坐标</small><span class="cost">消耗 2 燃料</span></button><button class="action" data-act="rest"><span class="icon">☾</span><strong>船员轮休</strong><small>恢复体力，但错过一夜搜寻</small><span class="cost">补充 1 燃料</span></button></div></section>
<footer class="footer"><span>雾港海上救援局 <strong>· 夜班记录员</strong></span><span>风向 NE 12 节 &nbsp; / &nbsp; 退潮 02:10</span></footer></main><div id="modalroot"></div>
<script>
(()=>{const $=s=>document.querySelector(s), log=$('#log'), modal=$('#modalroot');let s={night:1,fuel:7,signal:3,crew:4,rescued:0,found:5,done:false,seed:9381};const clamp=n=>Math.max(0,Math.min(10,n));function rand(){s.seed=(s.seed*1664525+1013904223)>>>0;return s.seed/4294967296}function entry(text,event=false){const el=document.createElement('div');el.className='log-line'+(event?' event':'');el.innerHTML='<time>'+String(23+Math.floor((s.night-1)*.7)).padStart(2,'0')+':'+String((40+(s.night-1)*11)%60).padStart(2,'0')+'</time><span>'+text+'</span>';log.prepend(el)}function update(){[['fuel',s.fuel],['signal',s.signal],['crew',s.crew]].forEach(([id,v])=>{$('#'+id).textContent=v;$('#'+id+'bar').style.width=(v/10*100)+'%'});$('#rescued').textContent=s.rescued+' / 7';$('#round').textContent='第 '+String(Math.min(s.night,10)).padStart(2,'0')+' / 10 夜';const disabled=s.done;document.querySelectorAll('.action').forEach(b=>{b.disabled=disabled||(b.dataset.act==='search'&&s.fuel<2)||(b.dataset.act==='signal'&&s.fuel<1)});$('#boat').style.left=(42+Math.min(38,s.night*4))+'%';$('#boat').style.top=(52+(s.night%3-1)*9)+'%';$('#route').style.strokeDashoffset=-s.night*8;$('#clock').textContent=String((23+Math.floor((s.night-1)*.7))%24).padStart(2,'0')+':'+String((40+(s.night-1)*11)%60).padStart(2,'0')}
function modalBox(kicker,title,body,options,onChoice){modal.innerHTML='<div class="overlay"><div class="modal"><div class="kicker">'+kicker+'</div><h2>'+title+'</h2><p>'+body+'</p><div class="choices">'+options.map((o,i)=>'<button class="'+(o.primary?'primary':'choice')+'" data-choice="'+i+'">'+o.text+'</button>').join('')+'</div></div></div>';modal.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const chosen=options[+b.dataset.choice];modal.innerHTML='';if(chosen.run)chosen.run();if(onChoice)onChoice();else if(kicker.startsWith('海上突发')){update();if(s.fuel<=0||s.crew<=0)finish(false,s.fuel<=0?'燃料耗尽，救援船无法继续搜索。':'船员体力耗尽，被迫返航。');else advance()}})}
function finish(win,reason){s.done=true;update();$('#end').classList.remove('hidden');$('#end').innerHTML='<div><div class="mission">'+(win?'救援完成':'任务终止')+'</div><h2>'+(win?'雾散之前':'海雾吞没了航线')+'</h2><p>'+reason+'<br>本次接回 '+s.rescued+' 位遇险者。</p><button class="primary" id="again">再跑一趟</button></div>';$('#again').onclick=()=>location.reload();entry(win?'<b>任务成功。</b> 救援船驶回港口。':'<b>任务结束。</b> '+reason,true)}function randomEvent(){if(rand()<.58){const events=[{title:'一段断续的摩斯码',body:'“……红礁……两个人……船进水了。”信号只维持了几秒。',choices:[{text:'把坐标记进海图 · 信号 +1',run:()=>{s.signal=clamp(s.signal+1);s.found+=1;entry('红礁坐标已标记。<b>信号 +1</b>，发现新目标。',true)}},{text:'留住电力，静候更清晰的呼叫',run:()=>entry('你没有回应。电台安静下来，只有风声。',true)}]},{title:'浮标缠住了缆绳',body:'左舷传来金属摩擦声。船员说可以现在处理，也可以割断旧缆。',choices:[{text:'停船解缆 · 消耗 1 燃料',run:()=>{s.fuel=Math.max(0,s.fuel-1);entry('缆绳解开了，船体没有受损。<b>燃料 -1</b>。',true)}},{text:'割断缆绳，继续航行',run:()=>{s.crew=Math.max(0,s.crew-1);entry('缆绳断了，船员被碎片划伤。<b>船员 -1</b>。',true)}}]},{title:'雾墙正在移动',body:'值班员在雷达上看到一条窄缝。那里也许能更快抵达北湾。',choices:[{text:'抓住窗口，强行穿过 · 信号 -1，燃料 +2',run:()=>{s.signal=Math.max(0,s.signal-1);s.fuel=clamp(s.fuel+2);entry('船从雾墙缝隙穿出，顺风带来额外燃料。<b>信号 -1，燃料 +2</b>。',true)}},{text:'保持航向，等待雾变薄',run:()=>{s.crew=clamp(s.crew+1);entry('船员轮流休息片刻。<b>船员 +1</b>。',true)}}] }];const e=events[Math.floor(rand()*events.length)];modalBox('海上突发 · 第 '+s.night+' 夜',e.title,e.body,e.choices)}else advance()}function advance(){if(s.rescued>=7){finish(true,'灯塔的最后一束光照亮了返航航道。');return}if(s.fuel<=0||s.crew<=0||s.night>10){finish(false,s.fuel<=0?'燃料耗尽，救援船无法继续搜索。':s.crew<=0?'船员体力耗尽，被迫返航。':'第十夜过去，海况恶化，救援窗口关闭。');return}s.night++;update();if(s.night>10)finish(false,'第十夜过去，救援窗口关闭。')}
function act(type){if(s.done)return;if(type==='signal'){s.fuel--;s.signal=clamp(s.signal+3);s.found+=2;entry('灯塔脉冲重新校准。<b>信号 +3</b>，雷达多出两个坐标。')}else if(type==='search'){if(s.fuel<2)return;s.fuel-=2;const chance=Math.min(.92,.38+s.signal*.055);if(rand()<chance&&s.found>0){const n=Math.min(s.found,1+(rand()>.72?1:0),7-s.rescued);s.rescued+=n;s.found-=n;entry('救援船找到漂浮的救生筏。<b>接回 '+n+' 人</b>。',true)}else{entry('探照灯扫过空荡的海面。雾太浓，暂时没有发现。',true)}}else{s.fuel=clamp(s.fuel+1);s.crew=clamp(s.crew+1);entry('轮班结束，船员恢复了体力。<b>燃料 +1，船员 +1</b>。')}update();if(s.rescued>=7){finish(true,'七位遇险者全部接回，天边已经泛白。');return}if(s.night>=10){s.night=11;finish(false,'第十夜过去，救援窗口关闭。');return}if(s.fuel<=0||s.crew<=0){finish(false,s.fuel<=0?'燃料耗尽，救援船无法继续搜索。':'船员体力耗尽，被迫返航。');return}if(rand()<.35)randomEvent();else advance()}
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>act(b.dataset.act));
$('#help').onclick=()=>modalBox('任务简报','十夜之内，接回七个人。','每晚选一个行动。校准信号能提高搜救成功率，驶入雾区会消耗燃料；休整可恢复船员。海上事件会带来额外取舍。燃料或船员耗尽，任务会提前结束。',[{text:'明白，出发',primary:true,run:()=>{}}]);
entry('<b>23:40。</b> 雾港灯塔最后一次亮起。北湾有三人等待救援。');entry('选择一个行动开始夜航。');update();})();
</script></body></html>
